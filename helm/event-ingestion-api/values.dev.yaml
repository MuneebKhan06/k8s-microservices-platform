# Dev overrides. Only the keys that differ from values.yaml belong here.
# Helm merges this on top of the defaults, so repeating unchanged values just
# creates two places to update when one of them moves.
#
#   helm upgrade --install event-ingestion-api ./helm/event-ingestion-api \
#     -n platform -f helm/event-ingestion-api/values.dev.yaml

# One replica. Two exists in production so a pod failure never drops the
# service to zero, which is not worth the node capacity while iterating.
replicaCount: 1

# Always pull, because the dev tag gets overwritten in the registry on every
# rebuild. With IfNotPresent the node keeps serving the image it cached the
# first time and you spend an hour debugging code that is not running.
image:
  tag: "dev"
  pullPolicy: Always

# Roughly a quarter of the production request. Enough to run, small enough
# that the whole platform fits on two workers alongside Kafka and Postgres.
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 250m
    memory: 192Mi

# Off in dev. The custom metrics chain is prometheus-adapter plus a
# ServiceMonitor plus a working PromQL rule, none of which is up yet, and an
# HPA pointing at a metric that does not resolve sits at <unknown> and
# pins the deployment at minReplicas anyway.
autoscaling:
  enabled: false

# Faster feedback. Production waits five minutes before liveness begins so a
# slow Kafka connect is not mistaken for a hang. In dev a container that has
# not come up in a minute is broken and the restart is the signal you want.
probes:
  startup:
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 10

config:
  logLevel: DEBUG

# Anti affinity off. On a single worker dev cluster it has nowhere to spread
# to and only adds noise to kubectl describe.
podAntiAffinity:
  enabled: false

# Placeholder, and it is fine that it is weak because this database holds
# throwaway data. Production must come from --set or External Secrets.
secrets:
  postgresPassword: "devpassword"
