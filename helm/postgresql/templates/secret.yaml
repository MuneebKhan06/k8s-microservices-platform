# Superuser password plus one password per application database. All four
# are read by the init script in the ConfigMap as environment variables at
# container start, which is what keeps the literal values out of that
# ConfigMap entirely.
#
# No safe default for the superuser password, same reasoning as
# api-gateway's JWT secret: a placeholder anyone who cloned this repository
# already knows defeats the point of having one. Install with:
#   helm upgrade --install postgresql ./helm/postgresql -n infra \
#     --set secrets.superuserPassword="$(openssl rand -hex 24)" \
#     --set secrets.eventsDbPassword="$EVENTS_DB_PASSWORD" \
#     --set secrets.jobqueuePassword="$JOBQUEUE_DB_PASSWORD" \
#     --set secrets.gatewayPassword="$GATEWAY_DB_PASSWORD"
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}-secret
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.superuserPassword is required" .Values.secrets.superuserPassword | quote }}
  {{- range .Values.databases }}
  {{ .envPrefix }}_PASSWORD: {{ required (printf "secrets.%s is required" .secretKey) (index $.Values.secrets .secretKey) | quote }}
  {{- end }}
{{- end }}
