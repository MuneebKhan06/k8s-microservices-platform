# Non secret configuration, shared by the api Deployment, the worker
# Deployment, and the migration Job. All three need the same Postgres host
# and none of them need different values for it, so one ConfigMap covers
# all three rather than duplicating the same keys per component.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "distributed-job-queue.fullname" . }}-config
  labels:
    {{- include "distributed-job-queue.labels" . | nindent 4 }}
data:
  API_HOST: "0.0.0.0"
  API_PORT: {{ .Values.api.service.targetPort | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  POSTGRES_HOST: {{ .Values.config.postgres.host | quote }}
  POSTGRES_PORT: {{ .Values.config.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.config.postgres.database | quote }}

  REDIS_HOST: {{ .Values.config.redis.host | quote }}
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_DB: {{ .Values.config.redis.db | quote }}

  WORKER_BATCH_SIZE: {{ .Values.config.worker.batchSize | quote }}
  WORKER_BLOCK_MS: {{ .Values.config.worker.blockMs | quote }}
  HIGH_PRIORITY_WEIGHT: {{ .Values.config.worker.highPriorityWeight | quote }}
  WORKER_METRICS_PORT: {{ .Values.worker.metricsPort | quote }}

  RETRY_BASE_DELAY_SECONDS: {{ .Values.config.retry.baseDelaySeconds | quote }}
  RETRY_MAX_DELAY_SECONDS: {{ .Values.config.retry.maxDelaySeconds | quote }}
  MAX_ATTEMPTS: {{ .Values.config.retry.maxAttempts | quote }}

  STREAM_MAX_LENGTH: {{ .Values.config.streamMaxLength | quote }}
  DLQ_MAX_LENGTH: {{ .Values.config.dlqMaxLength | quote }}
