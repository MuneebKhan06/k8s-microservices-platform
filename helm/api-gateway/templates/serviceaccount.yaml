# A dedicated ServiceAccount, unlike the other two charts, which run on the
# platform namespace's default one. This is the component sitting on the
# network boundary between outside traffic and everything else in the
# cluster, which makes it the one most worth being able to scope RBAC and
# NetworkPolicy to individually rather than to "every pod in platform".
# Nothing binds a Role to it yet; that is Day 6's namespace and RBAC work.
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "api-gateway.serviceAccountName" . }}
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
