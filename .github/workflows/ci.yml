# Lint every Helm chart and validate every plain manifest on every push and
# PR. This repo has no application code of its own to unit test; the thing
# that actually breaks here is a chart that fails to template, or a values
# file that silently drops a required key, and both of those are catchable
# without a cluster.
#
# Deliberately does not deploy anywhere. A deploy job needs real cluster
# credentials and this repo's cluster is a personal 3-node kubeadm setup
# behind a jump host with no public endpoint, not something a GitHub-hosted
# runner can reach. manifests/rbac.yaml's ci-deployer ServiceAccount is
# provisioned for when that changes, not used by this workflow yet.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"

      - name: Lint every chart
        run: |
          set -euo pipefail
          for chart in helm/*/; do
            echo "== $chart =="
            helm lint "$chart"
            if [[ -f "${chart}values.dev.yaml" ]]; then
              helm lint "$chart" -f "${chart}values.dev.yaml"
            fi
          done

      - name: Template every chart with default values
        run: |
          set -euo pipefail
          for chart in helm/*/; do
            echo "== $chart =="
            helm template test "$chart" >/dev/null
          done

  manifest-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate plain manifests
        # -ignore-missing-schemas: ServiceMonitor and PrometheusRule are
        # CRDs from kube-prometheus-stack, not part of the core Kubernetes
        # schema kubeconform ships with, and this job has no cluster to
        # pull their schema from.
        run: |
          find manifests -name '*.yaml' -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -summary
