# JWT signing key and the full Postgres connection string.
#
# DATABASE_URL is assembled here rather than in the ConfigMap because it
# embeds the password: postgresql+asyncpg://user:password@host:port/db is a
# credential in string form, and splitting it across a ConfigMap and Secret
# would just mean the password sits in the Secret while everything an
# attacker needs to use it sits in the ConfigMap next to it.
#
# gateway/config.py refuses to start in production if JWT_SECRET_KEY equals
# the repo's example value or is under 32 characters, or if DATABASE_URL
# still carries the example password. There is no safe default for
# jwtSecretKey in values.yaml for exactly that reason: install with
#   helm upgrade --install api-gateway ./helm/api-gateway -n platform \
#     --set secrets.jwtSecretKey="$(openssl rand -hex 32)" \
#     --set secrets.postgresPassword="$PGPASSWORD"
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-gateway.fullname" . }}-secret
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required: generate with `openssl rand -hex 32`" .Values.secrets.jwtSecretKey | quote }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.config.postgres.user }}:{{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword }}@{{ .Values.config.postgres.host }}:{{ .Values.config.postgres.port }}/{{ .Values.config.postgres.database }}"
{{- end }}
