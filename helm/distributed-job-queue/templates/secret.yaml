# Postgres credentials, shared by the api Deployment, the worker Deployment
# (it needs the database for job status writes), and the migration Job.
#
# Same caveat as the event-ingestion-api chart: a Kubernetes Secret is
# base64, not encryption, and the real fix is External Secrets Operator
# syncing from Vault or AWS Secrets Manager with no credential ever passing
# through a values file. existingSecret is the escape hatch for that.
#
# Install with an explicit override rather than the placeholder:
#   helm upgrade --install distributed-job-queue ./helm/distributed-job-queue \
#     -n platform --set secrets.postgresPassword="$PGPASSWORD"
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "distributed-job-queue.fullname" . }}-secret
  labels:
    {{- include "distributed-job-queue.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secrets.postgresUser is required" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
{{- end }}
