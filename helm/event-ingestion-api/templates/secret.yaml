# Database credentials. The application derives DATABASE_URL from the
# POSTGRES_* variables, so the password never has to be assembled into a
# connection string by hand in a values file.
#
# This is the weakest part of the chart and it is worth being explicit about
# why. A Kubernetes Secret is base64 encoded, not encrypted, and without
# encryption at rest configured on etcd anyone who can read etcd can read
# this. The correct pattern is External Secrets Operator syncing from Vault
# or AWS Secrets Manager, with no credential ever passing through a values
# file. That is a later day's work and is tracked as such.
#
# Until then, install with an explicit override rather than the placeholder:
#   helm upgrade --install event-ingestion-api ./helm/event-ingestion-api \
#     -n platform --set secrets.postgresPassword="$PGPASSWORD"
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "event-ingestion-api.fullname" . }}-secret
  labels:
    {{- include "event-ingestion-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ required "secrets.postgresUser is required" .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
{{- end }}
